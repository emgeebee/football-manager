<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Football Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="auth-gate" class="auth-gate">
      <div class="auth-card">
        <p class="auth-brand">Football Manager</p>
        <p class="auth-text">Sign in with Google to sync your team sheet.</p>
        <div id="google-btn" class="auth-google"></div>
        <p id="auth-error" class="auth-error" hidden></p>
      </div>
    </div>

    <div class="app" id="app" hidden>
      <header class="top">
        <div class="brand-block">
          <button type="button" class="brand" id="team-name" title="Season fixtures">
            Football Manager
          </button>
          <p class="tagline" id="tagline">Season fixtures</p>
        </div>

        <div class="header-end">
          <button type="button" class="btn btn-secondary" id="btn-share" hidden>Share</button>
          <div class="user-chip" id="user-chip" hidden>
            <img id="user-pic" alt="" width="28" height="28" />
            <span id="user-name"></span>
            <button type="button" class="btn-link" id="btn-sign-out">Sign out</button>
          </div>
        </div>

        <div class="share-banner" id="share-banner" hidden>
          <span id="share-banner-text">Viewing a shared team</span>
          <button type="button" class="btn-link" id="btn-leave-share">Open my team</button>
        </div>

        <div class="season-bar" id="season-bar">
          <nav class="modes" role="tablist" aria-label="Season view">
            <button type="button" class="mode active" data-season-tab="fixtures" role="tab" aria-selected="true">
              Fixtures
            </button>
            <button type="button" class="mode" data-season-tab="stats" role="tab" aria-selected="false">
              Stats
            </button>
            <button type="button" class="mode" data-season-tab="setup" id="scope-setup" role="tab" aria-selected="false" title="Team setup">
              Setup
            </button>
          </nav>
        </div>

        <div class="matchday-bar" id="matchday-bar" hidden>
          <button type="button" class="btn btn-secondary" id="btn-back-season">← Fixtures</button>
          <nav class="modes" role="tablist" aria-label="Match view">
            <button type="button" class="mode active" data-mode="match" role="tab" aria-selected="true">
              Match
            </button>
            <button type="button" class="mode" data-mode="edit" role="tab" aria-selected="false">
              Edit
            </button>
            <button type="button" class="mode" data-mode="teamsheet" role="tab" aria-selected="false">
              Teamsheet
            </button>
          </nav>
        </div>
      </header>

      <main>
        <section id="view-setup" class="view" aria-label="Team setup" hidden></section>
        <section id="view-season" class="view active" aria-label="Season"></section>
        <section id="view-match" class="view" aria-label="Match details" hidden></section>
        <section id="view-edit" class="view" aria-label="Edit match" hidden></section>
        <section id="view-teamsheet" class="view" aria-label="Teamsheet" hidden></section>
      </main>

      <p id="status" class="status" hidden></p>
      <p id="toast" class="toast" hidden></p>
    </div>

    <div id="share-modal" class="modal" hidden>
      <div class="modal__backdrop" data-share-close></div>
      <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="share-modal-title">
        <header class="modal__head">
          <h2 id="share-modal-title">Share team</h2>
          <button type="button" class="modal__close" data-share-close aria-label="Close">×</button>
        </header>
        <p class="modal__text share-modal__intro">
          Anyone with a link can view this team after signing in with Google. People who have
          opened it can be allowed to edit. Revoke a link to stop it working.
        </p>
        <p id="share-modal-error" class="share-modal__error" hidden></p>
        <div class="share-modal__actions">
          <button type="button" class="btn btn-secondary" id="share-create">Create share link</button>
        </div>
        <div id="share-modal-body" class="share-modal__body">
          <p class="share-modal__muted">Loading share links…</p>
        </div>
      </div>
    </div>

    <script src="./app.js" type="module"></script>
  </body>
</html>
